<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Under Development</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #51606e;
      --panel: rgba(255, 255, 255, 0.82);
      --line: rgba(23, 33, 43, 0.14);
      --accent: #0f8b8d;
      --accent-dark: #0a5d61;
      --gold: #f2b84b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(15, 139, 141, 0.9), rgba(10, 93, 97, 0.78)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80") center / cover;
      overflow-x: hidden;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      position: relative;
      isolation: isolate;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      pointer-events: none;
      z-index: -1;
    }

    .notice {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 72px);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 8px;
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.22);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #eef8f7);
      box-shadow: inset 0 0 0 8px rgba(15, 139, 141, 0.08);
    }

    .mark span {
      width: 34px;
      height: 34px;
      display: block;
      border: 5px solid var(--accent);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1.3s linear infinite;
    }

    .organization {
      margin: 0;
      font-size: clamp(2.7rem, 8.8vw, 6rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .status {
      margin: 18px 0 0;
      color: var(--accent-dark);
      font-size: clamp(1.35rem, 4vw, 2.35rem);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
      text-wrap: balance;
    }

    p {
      max-width: 540px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.65;
    }

    .divider {
      width: 92px;
      height: 4px;
      margin: 28px auto 0;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 999px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 18px;
      }

      main::before {
        inset: 12px;
      }

      .notice {
        padding: 30px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="notice" aria-label="Website status">
      <div class="mark" aria-hidden="true">
        <span></span>
      </div>
      <h1 class="organization">Bhuj Chamber of Commerce</h1>
      <div class="status">Website under Development</div>
      <div class="divider"></div>
      <p>We are preparing a better online experience and will be live soon.</p>
    </section>
  </main>
</body>
</html>
